<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬라이드 뷰어</title>
<link rel="icon" type="image/png" href="회사심볼.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hdr" id="hdr">
    <div class="hdr-l">
      <img class="hdr-logo" src="회사심볼.png" alt="회사 심볼">
      <div class="hdr-titlewrap">
        <div class="hdr-title">슬라이드 뷰어</div>
        <div class="hdr-sub">이미지 슬라이드 열람 &amp; 관리 도구</div>
      </div>
      <div class="proj-control" id="projControl">
        <div class="select-wrapper">
          <select id="projectSelect" onchange="onProjectChange(this.value)">
            <!-- dynamically populated -->
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <button class="btn-icon" id="renameProjBtn" onclick="renameCurrentProject()" title="프로젝트 이름 수정">
          <svg viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn-icon" id="addProjBtn" onclick="createNewProject()" title="새 프로젝트 추가">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="btn-icon danger" id="deleteProjBtn" onclick="deleteCurrentProject()" title="현재 프로젝트 삭제">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19 7l-.8 12a2 2 0 0 1-2 1.8H7.8a2 2 0 0 1-2-1.8L5 7M4 7h16M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="hdr-r">
      <div class="seg">
        <button class="seg-btn on" id="segSlide" onclick="setMode('slide')">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/></svg>
          슬라이드
        </button>
        <button class="seg-btn" id="segGrid" onclick="setMode('grid')">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
          그리드
        </button>
      </div>
      <button class="btn primary" id="addBtn" onclick="triggerAddImages()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="lbl">이미지 추가</span>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <button class="btn danger" id="clearAllBtn" onclick="clearAllSlides()" title="전체 슬라이드 삭제">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12a1 1 0 0 1-1 .9H8.8a1 1 0 0 1-1-.9L7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">전체 삭제</span>
      </button>
      <button class="btn-icon" id="configBtn" onclick="openConfigModal()" title="Supabase 연동 설정">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </header>

  <div class="hdr-toggle" id="hdrToggle" onclick="toggleHeader()" title="메뉴 접기/펴기">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="view-banner hidden" id="viewOnlyBanner">
    보기 전용 모드입니다. 이미지를 추가·순서변경하려면 <b>프로그램 시작.bat</b>을 먼저 실행하거나 우측 상단 톱니바퀴 아이콘을 눌러 <b>Supabase DB</b>를 연결해 주세요.
  </div>

  <div class="lay">

    <!-- 슬라이드 모드 -->
    <div id="slideMode">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <!-- content injected -->
        </div>
        <div class="nav-btn nav-prev" id="prevBtn" onclick="go(-1)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="nav-btn nav-next" id="nextBtn" onclick="go(1)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="thumb-toggle" id="thumbToggle" onclick="toggleThumbStrip()" title="슬라이드 목록 접기/펴기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
    </div>

    <!-- 그리드 모드 -->
    <div id="gridMode" class="grid-wrap hidden">
      <div class="grid-hd">
        <h2>전체 슬라이드</h2>
        <span id="gridCount">0장</span>
      </div>
      <div class="gv" id="gridGrid"></div>
    </div>

  </div>

  <!-- Supabase 설정 모달 -->
  <div class="modal-overlay hidden" id="configModal" onclick="onModalOverlayClick(event)">
    <div class="modal-box">
      <div class="modal-hd">
        <h3>Supabase 연동 설정</h3>
        <button class="modal-close" onclick="closeConfigModal()">&times;</button>
      </div>
      <div class="modal-bd">
        <p class="modal-desc">GitHub Pages 등의 웹 호스팅 환경에서 슬라이드를 업로드하고 편집하려면 본인의 Supabase API 정보를 입력해 주세요.</p>
        <div class="form-group">
          <label for="sbUrlInput">Supabase Project URL</label>
          <input type="text" id="sbUrlInput" placeholder="https://your-project.supabase.co">
        </div>
        <div class="form-group">
          <label for="sbKeyInput">Supabase anon Key (Public API Key)</label>
          <input type="password" id="sbKeyInput" placeholder="eyJh... (anon public API key)">
        </div>
        <div class="form-status error hidden" id="sbStatusMsg"></div>
      </div>
      <div class="modal-ft">
        <button class="btn danger hidden" id="sbClearBtn" onclick="clearSupabaseConfig()">연동 해제</button>
        <div style="flex:1"></div>
        <button class="btn" onclick="closeConfigModal()">취소</button>
        <button class="btn primary" onclick="saveSupabaseConfig()">저장 및 연결</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="slides-data.js"></script>
<script src="app.js"></script>
</body>
</html>
